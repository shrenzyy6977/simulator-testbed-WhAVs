[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whavs-testbed"
version = "1.0.0"
description = "2D simulator for wheeled autonomous vehicles: vehicle models, sensors, A* planning and path-tracking controllers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0", "pandas>=2.0", "tabulate>=0.9", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
