# RQ3: are policies trained in the upgraded simulator (ground classes, hills, sensor noise, delay)
# more robust on held-out terrains and noise levels than policies trained in a simple one?
# Regenerate with: python scripts/rq3_robustness.py all
mission:                       # shared by every condition (NavConfig fields)
  terrain: {size: 20.0, n: 65, elevation: {type: hills, amplitude: 0.0, wavelength: 6.0}}
  tiles: 4
  n_checkpoints: 4
  checkpoint_spacing: [4.0, 8.0]
  checkpoint_radius: 0.75
  max_steps: 900               # upper bound; the real budget comes from min_avg_speed
  min_avg_speed: 0.6           # [m/s] time budget = route length / 0.6 m/s (v_max is 1.0 m/s)
conditions:
  nominal:                     # what a simple 2D-style simulator offers: one flat ground, perfect GPS, no delay
    {grounds: [grass], amplitude_range: [0.0, 0.0], gps_noise: 0.0, delay_steps: 0}
  randomized:                  # training distribution of the upgraded simulator
    {grounds: [asphalt, grass, gravel, sand], amplitude_range: [0.0, 0.35], gps_noise_range: [0.0, 0.5],
     gps_bias: 0.3, delay_range: [0, 2]}
  held_out_ground:             # low-friction grounds never seen in training
    {grounds: [snow, mud], amplitude_range: [0.3, 0.45], gps_noise: 0.3, delay_steps: 1}
  steep_hills:                 # hills higher than anything in training
    {grounds: [grass, gravel, sand], amplitude_range: [0.55, 0.7], gps_noise: 0.3, delay_steps: 1}
  high_noise:                  # GPS noise, bias and delay beyond the training range
    {grounds: [asphalt, grass, gravel, sand], amplitude_range: [0.2, 0.2], gps_noise: 1.0, gps_bias: 0.5, delay_steps: 3}
train:
  ppo_nominal: nominal
  ppo_randomized: randomized
seeds: [0, 1, 2]
timesteps: 1000000
envs: 8
eval:
  conditions: [nominal, randomized, held_out_ground, steep_hills, high_noise]
  episodes: 50                 # per (policy, seed, condition); every policy sees the same episodes
