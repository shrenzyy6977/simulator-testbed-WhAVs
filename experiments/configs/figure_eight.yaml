# Figure-eight path (as in Liu et al., RCAR 2021), all four controllers, kinematic bicycle.
name: figure_eight
path: {name: figure_eight, size: 25.0, v_target: 8.0}
vehicle: {model: kinematic_bicycle}
controllers:
  - {name: pure_pursuit, k: 0.5, ld_min: 2.0}
  - {name: stanley, k: 1.0, ks: 1.0}
  - {name: lqr, q_e: 1.0, q_theta: 1.0, r: 5.0}
  - {name: mpc, horizon: 20, dt_pred: 0.1}
sim: {dt: 0.02, init_offset: 1.0}
settle_time: 5.0
